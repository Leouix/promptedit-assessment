services:
  app:
    build: .
    image: promptedit-app
    restart: unless-stopped
    volumes:
      - app-data:/var/www/html/database
      - public-build:/var/www/html/public/build
    env_file: .env
    environment:
      DB_DATABASE: /var/www/html/database/database.sqlite
      RUN_MIGRATIONS: "1"
    depends_on: []

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8077:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - public-build:/var/www/html/public/build:ro
    depends_on:
      - app

  queue:
    image: promptedit-app
    restart: unless-stopped
    volumes:
      - app-data:/var/www/html/database
      - public-build:/var/www/html/public/build
    env_file: .env
    environment:
      DB_DATABASE: /var/www/html/database/database.sqlite
    command: php artisan queue:work --tries=3 --max-time=3600
    depends_on:
      - app

  scheduler:
    image: promptedit-app
    restart: unless-stopped
    volumes:
      - app-data:/var/www/html/database
      - public-build:/var/www/html/public/build
    env_file: .env
    environment:
      DB_DATABASE: /var/www/html/database/database.sqlite
    command: sh -c "while true; do php artisan schedule:run --no-ansi; sleep 60; done"
    depends_on:
      - app

volumes:
  app-data:
  public-build:
